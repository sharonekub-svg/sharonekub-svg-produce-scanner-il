# Phase 4: all research data, MobileNetV3-L
# Classes matching exclude_source_regex are never trained on; they form the unseen-produce OOD test.
experiment: p4_r1_all_mnv3
seed: 1337
deterministic: true
threads: 4
data:
  processed_dir: data/processed_research
  datasets: null
  image_size: 224
  exclude_source_regex: (Asparagus|Leek|Red-Beet|Passion-Fruit|Brown-Cap-Mushroom|Common_fig|Radish|Mushroom|Quince|Cherimoya|Pitahaya|Carambola)
model:
  backbone: mobilenetv3_large_100
  pretrained: true
  pretrained_file: weights/mobilenetv3_large_100_ra-f55367f5.pth
  freeze_blocks: 4
  ripeness_mode: shared
  dropout: 0.2
train:
  epochs: 10
  batch_size: 32
  lr: 0.002
  backbone_lr_mult: 0.3
  weight_decay: 0.05
  warmup_frac: 0.1
  label_smoothing: 0.1
  balance_alpha: 0.5
  num_workers: 3
  head_weights:
    produce: 1.0
    ripeness: 1.0
    freshness: 1.0
    visual_spoilage: 0.5
  samples_per_epoch: 5000
augment:
  crop_scale:
  - 0.35
  - 1.0
  rotation_deg: 30
  brightness: 0.35
  contrast: 0.3
  saturation: 0.15
  hue: 0.01
  shadow_p: 0.3
  blur_p: 0.2
  noise_p: 0.3
  jpeg_p: 0.5
gates:
  produce:
    min_macro_f1: 0.85
    min_class_recall:
      default: 0.8
      banana: 0.9
      apple: 0.9
      tomato: 0.9
      avocado: 0.9
      cucumber: 0.9
    max_ece: 0.05
