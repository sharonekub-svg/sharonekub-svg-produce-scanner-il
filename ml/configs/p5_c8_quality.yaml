# C8: first quality model. Primary (produce + quality): Grocery Store + FruitNet phone photos (good/bad).
# Quality-only aux: Hass avocado ripening (studio), psolymos bananas, SoftwareMill lemons. Manifest v4.
experiment: p5_c8_quality
seed: 1337
deterministic: true
threads: 4
data:
  processed_dir: data/processed_commercial_v4
  datasets: null
  image_size: 224
model:
  backbone: mobilenetv3_large_100
  pretrained: true
  pretrained_file: weights/mobilenetv3_large_100_ra-f55367f5.pth
  freeze_blocks: 0
  ripeness_mode: shared
  dropout: 0.2
train:
  epochs: 12
  batch_size: 32
  lr: 0.002
  backbone_lr_mult: 0.3
  weight_decay: 0.05
  warmup_frac: 0.1
  label_smoothing: 0.1
  balance_alpha: 0.5
  samples_per_epoch: 6000
  # quality-only studio sets (produce loss masked, fixed share of each epoch)
  aux_datasets:
    hass_avocado_ripening: 0.15
    bananas_psolymos: 0.03
    lemon_softwaremill: 0.05
  num_workers: 3
  head_weights:
    produce: 1.0
    ripeness: 1.0
    freshness: 1.0
    visual_spoilage: 0.5
augment:
  crop_scale:
  - 0.35
  - 1.0
  rotation_deg: 30
  brightness: 0.35
  contrast: 0.3
  saturation: 0.15
  hue: 0.01
  shadow_p: 0.3
  blur_p: 0.2
  noise_p: 0.3
  jpeg_p: 0.5
gates:
  produce:
    min_macro_f1: 0.85
    min_class_recall:
      default: 0.8
      banana: 0.9
      apple: 0.9
      tomato: 0.9
      avocado: 0.9
      cucumber: 0.9
    max_ece: 0.05
