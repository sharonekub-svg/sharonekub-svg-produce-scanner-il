# C1 + lookalike negatives (lime, red grapefruit, zucchini, potato, passion fruit) removed from 'other'.
# At test they are measured as unseen produce (should abstain). See docs/results.md.
experiment: p4_c3_no_lookalike_other
seed: 1337
deterministic: true
threads: 4
data:
  processed_dir: data/processed_commercial
  datasets: null
  image_size: 224
  exclude_source_regex: (^|/)(Lime|Red-Grapefruit|Zucchini|Potato|Passion-Fruit)/
model:
  backbone: mobilenetv3_large_100
  pretrained: true
  pretrained_file: weights/mobilenetv3_large_100_ra-f55367f5.pth
  freeze_blocks: 0
  ripeness_mode: shared
  dropout: 0.2
train:
  epochs: 20
  batch_size: 32
  lr: 0.002
  backbone_lr_mult: 0.3
  weight_decay: 0.05
  warmup_frac: 0.1
  label_smoothing: 0.1
  balance_alpha: 0.5
  num_workers: 3
  head_weights:
    produce: 1.0
    ripeness: 1.0
    freshness: 1.0
    visual_spoilage: 0.5
augment:
  crop_scale:
  - 0.35
  - 1.0
  rotation_deg: 30
  brightness: 0.35
  contrast: 0.3
  saturation: 0.15
  hue: 0.01
  shadow_p: 0.3
  blur_p: 0.2
  noise_p: 0.3
  jpeg_p: 0.5
gates:
  produce:
    min_macro_f1: 0.85
    min_class_recall:
      default: 0.8
      banana: 0.9
      apple: 0.9
      tomato: 0.9
      avocado: 0.9
      cucumber: 0.9
    max_ece: 0.05
