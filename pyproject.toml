[project]
name = "produce-scanner-ml"
version = "0.1.0"
description = "Israeli fruit & produce scanner - on-device CV model (data pipeline, training, evaluation, export)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "python-multipart>=0.0.9", "onnxruntime>=1.17", "numpy>=1.26", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
export = ["onnx>=1.15", "onnxscript>=0.1", "coremltools>=7.2"]
dev = ["pytest>=8", "jsonschema>=4", "httpx>=0.27", "uvicorn>=0.29"]

# Vercel deploys the inference API (server/app.py); see server/README.md.
[tool.vercel]
entrypoint = "server.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
