[project]
name = "produce-scanner-ml"
version = "0.1.0"
description = "Israeli fruit & produce scanner - on-device CV model (data pipeline, training, evaluation, export)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
export = ["onnx>=1.15", "onnxruntime>=1.17", "coremltools>=7.2"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
