name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install numpy pillow pyyaml pytest jsonschema timm onnx onnxruntime onnxscript fastapi uvicorn python-multipart httpx
      - run: python -m pytest -q
      - name: decision parity fixtures are up to date
        run: |
          python scripts/gen_decision_fixtures.py
          git diff --exit-code app/__tests__/fixtures/decision_cases.json

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
