<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1411">
<title>סורק פירות וירקות</title>
<!-- UX: docs/ux-principles.md — camera is home, one primary action "סרוק פרי", answer first,
     honest uncertainty, confidence in words, visual-not-safety, calm motion, RTL-native. -->
<style>
  :root {
    --green:#2f7d4f; --ink:#1d1d1b; --muted:#6b6b66; --line:#E4E4DD; --sheet:#fff; --bg:#FAFAF7;
    --g-bg:#E3F3E8; --g-fg:#1f5c38; --a-bg:#FFF1DB; --a-fg:#8a5300; --r-bg:#FDE4E1; --r-fg:#9b1c1c;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#0f1411; color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif; }
  button { font:inherit; cursor:pointer; }
  [hidden] { display:none !important; }

  /* Camera (home) */
  #stage { position:fixed; inset:0; overflow:hidden; background:#0f1411; }
  #video, #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #still { display:none; }
  .hint { position:absolute; top:max(16px, env(safe-area-inset-top)); left:16px; right:16px; text-align:center;
    color:#fff; font-size:16px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .frame { position:absolute; left:50%; top:44%; width:min(72vw, 340px); aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:28px; box-shadow:0 0 0 2000px rgba(0,0,0,.28); border:3px solid rgba(255,255,255,.9); pointer-events:none; }
  .bar { position:absolute; left:0; right:0; bottom:0; padding:16px 16px calc(18px + var(--safe-b));
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .scan { min-width:220px; min-height:64px; border:0; border-radius:40px; background:var(--green); color:#fff;
    font-size:21px; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,.35); transition:transform .12s; }
  .scan:active { transform:scale(.96); }
  .row2 { display:flex; gap:18px; align-items:center; }
  .ghost { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:22px;
    padding:8px 16px; min-height:44px; font-size:15px; }
  .trust { color:rgba(255,255,255,.85); font-size:12px; text-align:center; }
  .checking { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); background:rgba(0,0,0,.6); color:#fff;
    padding:10px 18px; border-radius:24px; font-weight:700; display:none; }
  input[type=file] { display:none; }

  /* Permission card */
  .perm { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#0f1411; }
  .perm .card { background:var(--bg); border-radius:22px; padding:22px; max-width:380px; text-align:center; }
  .perm h1 { font-size:24px; margin:4px 0 8px; }
  .perm p { color:#3a3a36; margin:0 0 16px; }

  /* Result sheet */
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; background:var(--sheet);
    border-radius:22px 22px 0 0; padding:18px 16px calc(18px + var(--safe-b)); transform:translateY(105%);
    transition:transform .28s ease-out; box-shadow:0 -8px 30px rgba(0,0,0,.35); }
  #sheet.open { transform:translateY(0); }
  .grab { width:44px; height:5px; border-radius:3px; background:#d6d6cf; margin:0 auto 12px; }
  .idrow { display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .name { font-size:30px; font-weight:800; }
  .muted { color:var(--muted); font-size:14px; }
  .hero { border-radius:16px; padding:12px 14px; margin-top:12px; font-size:21px; font-weight:800; }
  .g { background:var(--g-bg); color:var(--g-fg); } .a { background:var(--a-bg); color:var(--a-fg); } .r { background:var(--r-bg); color:var(--r-fg); }
  .score { display:flex; gap:12px; align-items:center; margin-top:12px; }
  .badge { direction:ltr; border-radius:14px; padding:4px 12px; font-weight:800; white-space:nowrap; }
  .badge b { font-size:32px; } .badge span { font-size:15px; }
  .chips { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .chip { border-radius:14px; padding:6px 12px; font-size:15px; background:#EEE; }
  .chip small { display:block; color:var(--muted); font-size:12px; }
  .chip.g { background:var(--g-bg); color:var(--g-fg); } .chip.a { background:var(--a-bg); color:var(--a-fg); } .chip.r { background:var(--r-bg); color:var(--r-fg); }
  .tip { background:#F3F7F2; border-radius:12px; padding:12px; margin-top:12px; font-size:15px; }
  .disc { background:#FFF8E1; border-radius:12px; padding:10px; margin-top:12px; font-size:13px; }
  details { margin-top:10px; } summary { color:var(--green); font-weight:700; min-height:36px; list-style:none; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  details[open] summary::before { content:"▾ "; } details:not([open]) summary::before { content:"◂ "; }
  details ul { margin:4px 0 0; padding-inline-start:20px; font-size:15px; }
  .primary { display:block; width:100%; min-height:54px; border:0; border-radius:14px; background:var(--green); color:#fff;
    font-size:18px; font-weight:800; margin-top:14px; }
  .secondary { display:block; width:100%; min-height:50px; border:1.5px solid var(--green); border-radius:14px; background:#fff;
    color:var(--green); font-size:17px; font-weight:700; margin-top:10px; }
  .fb { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:12px; color:var(--muted); font-size:14px; }
  .fb button { min-width:44px; min-height:44px; border:0; background:none; font-size:24px; }
  .state { font-size:24px; font-weight:800; }
  @media (prefers-reduced-motion: reduce) { #sheet, .scan { transition:none; } }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <div class="hint" id="hint">צלמו פרי או ירק אחד, מקרוב ובאור טוב</div>
  <div class="frame" aria-hidden="true"></div>
  <div class="checking" id="checking" role="status">בודק…</div>
  <div class="bar">
    <button class="scan" id="scan" aria-label="סרוק פרי">סרוק פרי</button>
    <div class="row2">
      <label class="ghost" for="gal" role="button">🖼️ מהגלריה</label>
    </div>
    <div class="trust">הערכה חזותית · בלי הרשמה · בלי פרסומות · התמונה לא נשמרת</div>
  </div>
  <input id="gal" type="file" accept="image/*">
  <input id="cam" type="file" accept="image/*" capture="environment">
  <div class="perm" id="perm" hidden>
    <div class="card">
      <div style="font-size:44px">🍎📷</div>
      <h1>סורק פירות וירקות</h1>
      <p>כדי להעריך פרי צריך לצלם אותו. התמונה נשלחת לעיבוד בשרת שלנו, לא נשמרת ולא מועברת לאף אחד.</p>
      <button class="primary" id="permOk">אישור מצלמה</button>
      <button class="secondary" id="permNo">בלי מצלמה חיה – אצלם בנפרד</button>
    </div>
  </div>
</div>

<section id="sheet" aria-live="polite"><div class="grab"></div><div id="res"></div></section>

<script>
const FEEDBACK = { url: 'https://ucaahtdudyicliqwpvcu.supabase.co', key: 'sb_publishable__v13t2xj7oECaVCNfIiVMw_E-af0P8k' };
const TONE = { eat_now:'g', eat_soon:'a', overripe:'a', wait:'a', wait_little:'a', check_defects:'r', discard:'r' };
const ICON = { eat_now:'✅', eat_soon:'⏳', overripe:'⏳', wait:'🕒', wait_little:'🕒', check_defects:'🔎', discard:'⚠️' };
const CHIP_TONE = { ripe:'g', fresh:'g', none:'g', partially_ripe:'a', unripe:'a', overripe:'a', declining:'a', mild:'a',
                    spoiled:'r', severe:'r', not_fresh:'r', defects:'r' };
const STATE = { unsure:'🤔 לא בטוח', retake:'📷 צריך צילום נוסף', not_produce:'🔍 לא זוהה פרי או ירק' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conf = p => p == null ? '' : `${p >= 0.85 ? 'ביטחון גבוה' : p >= 0.7 ? 'ביטחון בינוני' : 'ביטחון נמוך'} (${Math.round(p * 20) * 5}%)`;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let stream = null, firstAngle = null, lastBlob = null, busy = false, last = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false });
    $('video').srcObject = stream; $('perm').hidden = true; store.set('cam', 'ok');
  } catch { useFallback(); }
}
function useFallback() { stream = null; $('perm').hidden = true; store.set('cam', 'no'); }

function showStill(url) { $('still').src = url; $('still').style.display = 'block'; }
function reset() {
  $('sheet').classList.remove('open'); $('still').style.display = 'none'; $('checking').style.display = 'none';
  $('hint').textContent = firstAngle ? 'צלמו את אותו הפרי מצד אחר' : 'צלמו פרי או ירק אחד, מקרוב ובאור טוב';
  busy = false;
}

function frameBlob() {
  const v = $('video'), c = document.createElement('canvas');
  const s = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}

async function onScan() {
  if (busy) return;
  if (!stream) { $('cam').click(); return; }       // no live camera: native camera sheet
  busy = true;
  const blob = await frameBlob();
  showStill(URL.createObjectURL(blob));
  analyze(blob);
}

async function analyze(blob) {
  lastBlob = blob; busy = true; $('checking').style.display = 'block';
  try {
    const fd = new FormData(); fd.append('image', firstAngle || blob);
    if (firstAngle) fd.append('image2', blob);
    const res = await fetch('/v1/scan', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(res.status);
    last = await res.json(); firstAngle = null; render(last);
  } catch {
    firstAngle = null;
    render({ status: 'error' });
  } finally { $('checking').style.display = 'none'; }
}

function chip(title, h) {
  if (!h || !h.available) return '';
  return `<div class="chip ${CHIP_TONE[h.label] || ''}"><small>${title}</small>${esc(h.label_he)}</div>`;
}

function render(r) {
  let h = '';
  if (r.status === 'ok') {
    h += `<div class="idrow"><div class="name">${esc(r.emoji)} ${esc(r.produce_he)}</div><div class="muted">${conf(r.produce_confidence)}</div></div>`;
    const assessed = r.recommendation && r.recommendation !== 'inspect';
    if (assessed) h += `<div class="hero ${TONE[r.recommendation] || 'a'}" role="heading">${ICON[r.recommendation] || ''} ${esc(r.recommendation_he)}</div>`;
    if (r.score != null) {
      const t = r.score >= 8 ? 'g' : r.score >= 5 ? 'a' : 'r';
      h += `<div class="score"><div class="badge ${t}" aria-label="ציון ${r.score} מתוך 10"><b>${r.score}</b><span>/10</span></div>
            <div><div class="muted">ציון איכות חזותי</div><div>${esc(r.score_reason_he)}</div></div></div>`;
    } else {
      h += `<p class="muted" style="margin:10px 0 0">${esc(r.score_reason_he)}</p>`;
    }
    const chips = chip('בשילות', r.ripeness) + chip('טריות', r.freshness) + chip('פגמים', r.visual_spoilage);
    if (chips) h += `<div class="chips">${chips}</div>`;
    if (r.storage_tip_he && !['discard', 'check_defects'].includes(r.recommendation))
      h += `<div class="tip"><b>💡 טיפ אחסון (כללי)</b><br>${esc(r.storage_tip_he)}</div>`;
    h += `<div class="disc">&#x200F;ⓘ ${esc(r.disclaimer_he)}</div>`;
    if (r.top3) h += `<details><summary>מה זיהינו?</summary><ul>${r.top3.map(t => `<li>${esc(t.he)} — ${Math.round(t.prob * 20) * 5}%</li>`).join('')}</ul></details>`;
    if (assessed && r.explanation_he && r.explanation_he.length)
      h += `<details><summary>למה?</summary><ul>${r.explanation_he.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>`;
    h += `<button class="primary" id="again">סרוק פרי נוסף</button>
          <div class="fb" id="fb">האם הזיהוי נכון? <button aria-label="כן" data-v="1">👍</button><button aria-label="לא" data-v="0">👎</button></div>`;
  } else if (r.status === 'error') {
    h += `<div class="state">משהו השתבש</div><p>בדקו את החיבור לאינטרנט ונסו שוב.</p><button class="primary" id="again">נסה שוב</button>`;
  } else {
    h += `<div class="state">${STATE[r.status] || ''}</div><p style="font-size:18px">${esc(r.message_he)}</p>`;
    if (r.status === 'unsure' && (r.angles || 1) < 2) {
      h += `<button class="primary" id="angle">צלם מזווית נוספת</button><button class="secondary" id="again">נסה שוב</button>`;
    } else {
      h += `<button class="primary" id="again">נסה שוב</button>`;
    }
  }
  $('res').innerHTML = h;
  $('sheet').classList.add('open');
  $('again') && ($('again').onclick = () => { firstAngle = null; reset(); });
  $('angle') && ($('angle').onclick = () => { firstAngle = lastBlob; reset(); });
  document.querySelectorAll('#fb button').forEach(b => b.onclick = () => sendFeedback(b.dataset.v === '1'));
}

async function sendFeedback(correct) {
  $('fb').textContent = 'תודה! המשוב עוזר לשפר את המודל.';
  try {
    await fetch(`${FEEDBACK.url}/rest/v1/scan_feedback`, { method: 'POST',
      headers: { apikey: FEEDBACK.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ model_id: last.model_id, status: last.status, produce: last.produce,
                             confidence: last.produce_confidence, correct, app_version: 'web' }) });
  } catch {}
}

function fromFile(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || busy) return;
  showStill(URL.createObjectURL(f)); analyze(f);
}
$('scan').onclick = onScan;
$('gal').onchange = fromFile; $('cam').onchange = fromFile;
$('permOk').onclick = startCamera; $('permNo').onclick = useFallback;

// First visit: explain why we need the camera (principle 2). Returning visitors go straight to the camera.
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) useFallback();
else if (store.get('cam') === 'ok') startCamera();
else if (store.get('cam') === 'no') useFallback();
else $('perm').hidden = false;
</script>
</body>
</html>
