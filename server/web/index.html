<head>

<meta name="theme-color" content="#0e1512">
<meta name="description" content="צלמו פרי או ירק וקבלו זיהוי, ציון איכות חזותי מ-1 עד 10 והמלצה – בעברית.">

<title>סורק פירות וירקות</title>
<!--
  UX source of truth: docs/ux-principles.md + docs/competitor-ux-research.md (§6–7).
  Camera is home · one primary action "סרוק פרי" · answer first · score + verdict word (Yuka) ·
  honest live photo-quality guidance (Seek) · first scan can use a sample (PictureThis) ·
  installable (FreshPick) · visual-only, never "safe" · calm motion · RTL-native · Heebo.
-->
<style>
:root {
  --brand:#1B6E45; --brand-2:#2FA36B; --brand-ink:#0F3D27;
  --ink:#121814; --ink-2:#3A433D; --muted:#6B736D; --line:#E7EAE4; --bg:#F5F6F1; --card:#fff;
  --ok:#1E9E5A; --ok-bg:#E4F4EA; --good:#5AA33C; --mid:#E3A21A; --mid-bg:#FFF3DC; --weak:#E4702A; --bad:#D2382F; --bad-bg:#FDE6E3;
  --cam:#0e1512;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --shadow: 0 10px 30px rgba(10,20,14,.18);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--cam); color:var(--ink);
  font-family:"Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- Camera (home) ---------- */
#stage { position:fixed; inset:0; overflow:hidden; background:radial-gradient(120% 80% at 50% 30%, #1d2a23 0%, var(--cam) 70%); }
@media (min-width: 560px) { #stage { left:50%; width:430px; transform:translateX(-50%); border-inline:1px solid #222; } }
#video, #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#still { display:none; }
.flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
.flash.on { animation:flash .28s ease-out; }
@keyframes flash { 0% { opacity:.85 } 100% { opacity:0 } }

.top { position:absolute; top:calc(12px + var(--safe-t)); inset-inline:14px; display:flex; align-items:center; justify-content:space-between; z-index:3; }
.brand { display:flex; align-items:center; gap:8px; color:#fff; font-weight:800; font-size:17px; letter-spacing:-.2px;
  text-shadow:0 1px 6px rgba(0,0,0,.4); }
.brand img { width:28px; height:28px; border-radius:8px; }
.iconbtn { width:44px; height:44px; border-radius:22px; display:grid; place-items:center; color:#fff;
  background:rgba(0,0,0,.28); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-size:18px; font-weight:700; }

.guide { position:absolute; top:calc(66px + var(--safe-t)); left:50%; transform:translateX(-50%); z-index:3;
  display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:20px; white-space:nowrap;
  background:rgba(0,0,0,.42); color:#fff; font-size:15px; font-weight:500; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:background .25s; }
.guide .dot { width:9px; height:9px; border-radius:5px; background:#bbb; }
.guide.ok .dot { background:#46d27f; } .guide.warn .dot { background:#ffb020; }

.viewfinder { position:absolute; left:50%; top:46%; width:min(74vw, 320px); aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; }
.corner { position:absolute; width:46px; height:46px; border:4px solid rgba(255,255,255,.95); }
.corner.tl { top:0; left:0; border-right:0; border-bottom:0; border-radius:26px 0 0 0; }
.corner.tr { top:0; right:0; border-left:0; border-bottom:0; border-radius:0 26px 0 0; }
.corner.bl { bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 26px; }
.corner.br { bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 26px 0; }
.scanline { position:absolute; inset-inline:8%; height:3px; top:10%; border-radius:3px; opacity:0;
  background:linear-gradient(90deg, transparent, #7CF0AE, transparent); box-shadow:0 0 18px #46d27f; }
.analyzing .scanline { opacity:1; animation:sweep 1.1s ease-in-out infinite alternate; }
@keyframes sweep { from { top:10% } to { top:88% } }
.checking { position:absolute; left:50%; top:calc(46% + min(37vw,160px) + 18px); transform:translateX(-50%);
  background:rgba(0,0,0,.6); color:#fff; padding:8px 18px; border-radius:20px; font-weight:700; display:none; z-index:3; }
.analyzing .checking { display:block; }
.analyzing .controls { opacity:.45; pointer-events:none; transition:opacity .2s; }

.welcome { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:min(80vw, 340px); text-align:center; color:#fff; z-index:2; }
.welcome img { width:84px; height:84px; border-radius:22px; box-shadow:0 12px 30px rgba(0,0,0,.35); }
.welcome h1 { font-size:28px; font-weight:900; margin:14px 0 6px; letter-spacing:-.4px; }
.welcome p { margin:0; color:rgba(255,255,255,.85); font-size:16px; }
.welcome .facts { display:flex; justify-content:center; gap:14px; margin-top:14px; font-size:13px; color:rgba(255,255,255,.75); }

.bottom { position:absolute; inset-inline:0; bottom:0; padding:18px 18px calc(16px + var(--safe-b)); z-index:3;
  background:linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,0)); display:flex; flex-direction:column; align-items:center; gap:12px; }
.controls { width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
.side { justify-self:center; display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; font-size:12px; opacity:.95; }
.side .iconbtn { width:48px; height:48px; border-radius:24px; font-size:20px; }
.scan { height:68px; padding:0 30px; border-radius:34px; background:#fff; color:var(--brand-ink);
  font-size:21px; font-weight:900; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:transform .12s ease; }
.scan .ring { width:30px; height:30px; border-radius:15px; background:var(--brand); box-shadow:0 0 0 4px #D7F0E1; }
.scan:active { transform:scale(.95); }
.scan[disabled] { opacity:.7; }
.trust { color:rgba(255,255,255,.78); font-size:12px; text-align:center; }
input[type=file] { display:none; }

/* ---------- Sheets ---------- */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s; z-index:9; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; inset-inline:0; bottom:0; z-index:10; max-height:90vh; overflow:auto; background:var(--bg);
  border-radius:var(--r-lg) var(--r-lg) 0 0; transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:10px 16px calc(16px + var(--safe-b)); box-shadow:0 -10px 40px rgba(0,0,0,.35); overscroll-behavior:contain; }
@media (min-width: 560px) { .sheet { left:50%; width:430px; transform:translate(-50%,105%); } .sheet.open { transform:translate(-50%,0) !important; } }
.sheet.open { transform:translateY(0); }
.handle { width:42px; height:5px; border-radius:3px; background:#CDD2CB; margin:0 auto 10px; }

.card { background:var(--card); border-radius:var(--r-md); padding:14px; margin-top:10px; border:1px solid var(--line); }
.head { display:flex; align-items:center; gap:12px; }
.thumb { width:58px; height:58px; border-radius:16px; object-fit:cover; background:#ddd; flex:none; }
.name { font-size:26px; font-weight:900; line-height:1.1; letter-spacing:-.3px; }
.conf { color:var(--muted); font-size:14px; margin-top:2px; }

.score { display:flex; align-items:center; gap:16px; }
.gauge { width:92px; height:92px; flex:none; position:relative; }
.gauge svg { width:100%; height:100%; transform:rotate(-90deg); }
.gauge .num { position:absolute; inset:0; display:grid; place-items:center; direction:ltr; }
.gauge .num b { font-size:34px; font-weight:900; line-height:1; }
.gauge .num small { font-size:12px; color:var(--muted); display:block; text-align:center; margin-top:-2px; }
.verdict { font-size:24px; font-weight:900; line-height:1.15; }
.reason { color:var(--ink-2); margin-top:4px; }
.label-sm { color:var(--muted); font-size:13px; font-weight:500; }

.action { display:flex; gap:10px; align-items:flex-start; border-radius:var(--r-md); padding:14px; margin-top:10px; font-size:19px; font-weight:800; line-height:1.35; }
.action .ic { font-size:22px; line-height:1.2; }
.t-ok { background:var(--ok-bg); color:#12603A; } .t-mid { background:var(--mid-bg); color:#8A5300; } .t-bad { background:var(--bad-bg); color:#9B1C1C; }

h3 { font-size:15px; margin:0 0 8px; color:var(--ink-2); font-weight:800; }
.scale { margin-top:10px; }
.scale .shd { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
.scale .shd b { font-size:15px; }
.bar { position:relative; display:flex; gap:3px; margin-top:6px; direction:rtl; }
.seg { flex:1; height:8px; border-radius:4px; opacity:.28; }
.seg.on { opacity:1; }
.ticks { display:flex; gap:3px; margin-top:4px; }
.ticks span { flex:1; text-align:center; font-size:11px; color:var(--muted); }
.ticks span.on { color:var(--ink); font-weight:700; }

.tip { background:#EEF6EF; border:0; }
.tip b { display:block; margin-bottom:2px; }
.disc { color:var(--muted); font-size:12.5px; margin-top:12px; text-align:center; }
details { margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:0 14px; }
summary { list-style:none; min-height:48px; display:flex; align-items:center; justify-content:space-between; font-weight:700; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"‹"; font-size:22px; color:var(--muted); transition:transform .2s; }
details[open] summary::after { transform:rotate(-90deg); }
details .body { padding-bottom:12px; }
.alt { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:15px; }
.alt .track { flex:1; height:6px; border-radius:3px; background:#E9ECE6; overflow:hidden; }
.alt .fill { height:100%; background:var(--brand-2); border-radius:3px; }
.alt .pct { width:40px; text-align:left; color:var(--muted); font-size:13px; direction:ltr; }
ul.why { margin:0; padding-inline-start:18px; color:var(--ink-2); }

.actions { position:sticky; bottom:calc(-16px - var(--safe-b)); background:linear-gradient(to top, var(--bg) 70%, rgba(245,246,241,0)); padding:14px 0 calc(4px + var(--safe-b)); margin-top:6px; }
.primary { width:100%; min-height:56px; border-radius:var(--r-md); background:var(--brand); color:#fff; font-size:18px; font-weight:800; }
.secondary { width:100%; min-height:50px; border-radius:var(--r-md); background:#fff; border:1.5px solid var(--brand); color:var(--brand); font-size:17px; font-weight:700; margin-top:10px; }
.fb { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:8px; color:var(--muted); font-size:14px; }
.fb button { width:44px; height:44px; border-radius:22px; font-size:22px; }
.fb button:active { background:#e9ece6; }

.state { text-align:center; padding:6px 4px 0; }
.state .big { font-size:46px; }
.state .pic { position:relative; display:inline-block; margin-bottom:10px; }
.state .pic img { width:84px; height:84px; border-radius:22px; object-fit:cover; display:block; box-shadow:0 6px 18px rgba(0,0,0,.15); }
.state .pic .badge { position:absolute; bottom:-8px; inset-inline-start:-10px; width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:22px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.nw { white-space:nowrap; }
.state h2 { font-size:24px; font-weight:900; margin:4px 0 6px; }
.state p { color:var(--ink-2); font-size:17px; margin:0 auto; max-width:320px; }

.samples { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.samples button { border-radius:var(--r-md); overflow:hidden; background:#fff; border:1px solid var(--line); padding:0; text-align:center; }
.samples img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.samples span { display:block; padding:6px 4px; font-size:14px; font-weight:700; }
.info h2 { font-size:22px; font-weight:900; margin:4px 0 10px; }
.info li { margin:4px 0; }
.pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.pill { background:var(--ok-bg); color:#12603A; border-radius:14px; padding:4px 10px; font-size:14px; font-weight:700; }
.small { color:var(--muted); font-size:13px; }
.ico { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.side .ico { width:24px; height:24px; }
.tbtns { display:flex; gap:8px; }
.iconbtn { position:relative; }
.hdot { position:absolute; top:9px; inset-inline-end:9px; width:8px; height:8px; border-radius:50%; background:var(--brand-2); box-shadow:0 0 0 2px rgba(0,0,0,.35); }
.welcome .rated { margin-top:18px; display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:18px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.85); font-size:13px; }
.welcome .rated #ratedList { font-size:18px; letter-spacing:2px; }
.welcome img { animation:float 5s ease-in-out infinite; }
@keyframes float { 50% { transform:translateY(-5px); } }
.share { margin-inline-start:auto; width:40px; height:40px; border-radius:20px; display:grid; place-items:center; color:var(--brand); background:var(--ok-bg); flex:none; }
.share .ico { width:20px; height:20px; }
.hist { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px; }
.hist li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:8px 10px; }
.hist img { width:48px; height:48px; border-radius:12px; object-fit:cover; background:#ddd; flex:none; }
.hist .t { flex:1; min-width:0; }
.hist .t b { display:block; font-size:16px; }
.hist .t span { color:var(--muted); font-size:13px; }
.hist .sc { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:18px; color:#fff; flex:none; }
.hist .sc.none { background:#E9ECE6; color:var(--muted); font-size:15px; }
.empty { text-align:center; color:var(--muted); padding:26px 8px; }
.empty .big { font-size:42px; }
.toast { position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%, 20px); opacity:0; z-index:50; background:#111; color:#fff;
  padding:10px 16px; border-radius:20px; font-size:14px; white-space:nowrap; transition:.25s; pointer-events:none; }
.toast.on { opacity:1; transform:translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .welcome img { animation:none; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .scan, .guide { transition:none; } .analyzing .scanline { animation:none; top:50%; } .flash.on { animation:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></symbol>
    <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 8v4.2l3 1.8"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5.5-5.5 4 4L16 14l4 4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.9-5.7 1.9L12 18.5l-1.8-5.7L4.5 10.9 10.2 9z"/><path d="M19 3v3M17.5 4.5h3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5"/><path d="m7.5 8 4.5-4.5L16.5 8"/><path d="M5 12.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5.5"/></symbol>
  </defs>
</svg>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <div class="flash" id="flash"></div>

  <div class="top">
    <div class="brand"><img src="/web/icon-192.png" alt="">סורק פירות</div>
    <div class="tbtns"><button class="iconbtn" id="histBtn" aria-label="הסריקות שלי"><svg class="ico"><use href="#i-hist"/></svg><span class="hdot" id="hdot" hidden></span></button>
    <button class="iconbtn" id="infoBtn" aria-label="איך זה עובד"><svg class="ico"><use href="#i-info"/></svg></button></div>
  </div>

  <div class="guide" id="guide" hidden><span class="dot"></span><span id="guideText">כוונו אל פרי אחד</span></div>

  <div class="welcome" id="welcome">
    <img src="/web/icon-192.png" alt="">
    <h1>מה מצב הפרי?</h1>
    <p>צלמו פרי או ירק – וקבלו זיהוי, ציון איכות <span class="nw">מ-1 עד 10</span> והמלצה מה לעשות איתו.</p>
    <div class="facts"><span>⚡ תוך שניות</span><span>🔒 בלי הרשמה</span><span>🇮🇱 בעברית</span></div>
    <div class="rated" id="rated" hidden><span class="lbl">ציון איכות זמין ל:</span><span id="ratedList"></span></div>
  </div>

  <div class="viewfinder" id="vf" hidden>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="scanline"></div>
  </div>
  <div class="checking" role="status">בודק…</div>

  <div class="bottom">
    <div class="controls">
      <div class="side"><button class="iconbtn" id="galBtn" aria-label="בחירת תמונה מהגלריה"><svg class="ico"><use href="#i-img"/></svg></button><span>גלריה</span></div>
      <button class="scan" id="scan"><span class="ring" aria-hidden="true"></span>סרוק פרי</button>
      <div class="side"><button class="iconbtn" id="sampleBtn" aria-label="תמונות לדוגמה"><svg class="ico"><use href="#i-spark"/></svg></button><span>דוגמה</span></div>
    </div>
    <div class="trust">הערכה חזותית בלבד · התמונה לא נשמרת בשרת</div>
  </div>
  <input id="gal" type="file" accept="image/*">
  <input id="cam" type="file" accept="image/*" capture="environment">
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><div id="sheetBody"></div></section>

<script>
/* ---------- config ---------- */
const FEEDBACK = { url: 'https://ucaahtdudyicliqwpvcu.supabase.co', key: 'sb_publishable__v13t2xj7oECaVCNfIiVMw_E-af0P8k' };
// Same thresholds as the server's photo-quality gate (ml/inference/quality.py DEFAULTS), used for live guidance only.
const Q = { minLuma: 40, maxLuma: 235, minLap: 30, maxClip: 0.35, size: 256 };
const SAMPLES = [
  { file: 'banana.jpg', he: 'בננות' }, { file: 'apple_rotten.jpg', he: 'תפוח' }, { file: 'pomegranate.jpg', he: 'רימון' } ];
const ACTION = {
  eat_now: ['t-ok', '✅'], eat_soon: ['t-mid', '⏳'], overripe: ['t-mid', '🍌'], wait: ['t-mid', '🕒'], wait_little: ['t-mid', '🕒'],
  check_defects: ['t-bad', '🔎'], discard: ['t-bad', '⚠️'] };
const STATE = { unsure: ['🤔', 'לא בטוח'], retake: ['📷', 'צריך צילום נוסף'], not_produce: ['🔍', 'לא זוהה פרי או ירק'] };
// Scales: order and colour per head (labels come from the server in Hebrew).
const SCALES = {
  ripeness: { title: 'בשילות', stops: [['unripe', 'לא בשל', '#9CC86A'], ['partially_ripe', 'כמעט', '#C7C94A'], ['ripe', 'בשל', '#2FA36B'], ['overripe', 'בשל מאוד', '#E3A21A']] },
  freshness: { title: 'טריות', stops: [['fresh', 'טרי', '#2FA36B'], ['declining', 'פחות טרי', '#E3A21A'], ['spoiled', 'מקולקל', '#D2382F']] },
  freshness_c: { title: 'טריות', stops: [['fresh', 'טרי', '#2FA36B'], ['not_fresh', 'לא טרי', '#D2382F']] },
  visual_spoilage: { title: 'פגמים בקליפה', stops: [['none', 'אין', '#2FA36B'], ['mild', 'קלים', '#E3A21A'], ['severe', 'חמורים', '#D2382F']] },
  visual_spoilage_c: { title: 'פגמים בקליפה', stops: [['none', 'אין', '#2FA36B'], ['defects', 'נראים פגמים', '#D2382F']] },
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct5 = p => `${Math.round(p * 20) * 5}%`;
const confText = p => p == null ? '' : `${p >= 0.85 ? 'ביטחון גבוה' : p >= 0.7 ? 'ביטחון בינוני' : 'ביטחון נמוך'} בזיהוי · ${pct5(p)}`;
const verdict = s => s >= 9 ? ['מצוין', 'var(--ok)'] : s >= 7 ? ['טוב', 'var(--good)'] : s >= 5 ? ['סביר', 'var(--mid)'] : s >= 3 ? ['חלש', 'var(--weak)'] : ['לא מומלץ', 'var(--bad)'];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let stream = null, busy = false, last = null, lastBlob = null, firstAngle = null, photoUrl = null, qualityTimer = null, bundle = null;

/* ---------- camera ---------- */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) return false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = stream; await $('video').play().catch(() => {});
    store.set('cam', 'ok'); showLive(); return true;
  } catch { store.set('cam', 'no'); return false; }
}
function showLive() {
  $('welcome').hidden = true; $('vf').hidden = false; $('guide').hidden = false;
  clearInterval(qualityTimer); qualityTimer = setInterval(liveQuality, 450);
}

// Live photo-quality guidance (Seek-style, but honest: light and focus only, same thresholds as the server).
const qc = document.createElement('canvas'), qx = qc.getContext('2d', { willReadFrequently: true });
function liveQuality() {
  const v = $('video'); if (!stream || busy || !v.videoWidth) return;
  const s = Q.size / Math.max(v.videoWidth, v.videoHeight), w = Math.round(v.videoWidth * s), h = Math.round(v.videoHeight * s);
  qc.width = w; qc.height = h; qx.drawImage(v, 0, 0, w, h);
  const d = qx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  let sum = 0, clip = 0;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; g[j] = y; sum += y; if (y <= 3 || y >= 252) clip++; }
  let ls = 0, lq = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const k = y * w + x, l = g[k - w] + g[k + w] + g[k - 1] + g[k + 1] - 4 * g[k]; ls += l; lq += l * l; n++; }
  const mean = sum / (w * h), lap = n ? lq / n - (ls / n) ** 2 : 0, cf = clip / (w * h);
  let cls = 'ok', txt = 'נראה טוב – אפשר לסרוק';
  if (mean < Q.minLuma) { cls = 'warn'; txt = 'חשוך מדי – התקרבו לאור'; }
  else if (mean > Q.maxLuma || cf > Q.maxClip) { cls = 'warn'; txt = 'יש סנוור – הזיזו מעט את הזווית'; }
  else if (lap < Q.minLap) { cls = 'warn'; txt = 'מטושטש – החזיקו יציב והתקרבו'; }
  $('guide').className = 'guide ' + cls; $('guideText').textContent = txt;
}

function frameBlob() {
  const v = $('video'), c = document.createElement('canvas');
  const s = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}

/* ---------- scan flow ---------- */
async function onScan() {
  if (busy) return;
  if (!stream) {                       // just-in-time camera permission (Yuka); fall back to the native camera
    if (store.get('cam') !== 'no' && await startCamera()) return;
    $('cam').click(); return;
  }
  buzz(8);
  if (!reduceMotion) { $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on'); }
  analyze(await frameBlob());
}

async function analyze(blob) {
  if (busy) return;
  busy = true; lastBlob = blob;
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(blob);
  $('still').src = photoUrl; $('still').style.display = 'block';
  $('welcome').hidden = true; $('vf').hidden = false; $('guide').hidden = true;
  $('stage').classList.add('analyzing'); closeSheet(false);
  try {
    const fd = new FormData();
    if (firstAngle) { fd.append('image', firstAngle); fd.append('image2', blob); } else fd.append('image', blob);
    const res = await fetch('/v1/scan', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(res.status);
    last = await res.json(); firstAngle = null; buzz(12); renderResult(last);
  } catch { firstAngle = null; renderError(); }
  finally { $('stage').classList.remove('analyzing'); }
}

function reset() {
  closeSheet(); busy = false;
  $('still').style.display = 'none';
  if (stream) { $('guide').hidden = false; $('vf').hidden = false; }
  else { $('vf').hidden = true; $('welcome').hidden = false; }
  if (firstAngle) { $('guide').hidden = false; $('guide').className = 'guide'; $('guideText').textContent = 'צלמו את אותו הפרי מצד אחר'; }
}

/* ---------- sheet ---------- */
function openSheet(html, title) {
  $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); $('scrim').classList.add('on');
  $('sheet').setAttribute('aria-label', title || ''); $('sheet').scrollTop = 0;
}
function closeSheet(resume = true) { $('sheet').classList.remove('open'); $('scrim').classList.remove('on'); if (resume) busy = false; }

function gauge(score) {
  const r = 38, c = 2 * Math.PI * r;
  if (score == null) return `<div class="gauge" aria-hidden="true"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#E3E7E0" stroke-width="9" stroke-dasharray="4 6"/></svg><div class="num"><b style="color:#9aa39c">—</b></div></div>`;
  const [, col] = verdict(score), off = c * (1 - score / 10);
  return `<div class="gauge" role="img" aria-label="ציון ${score} מתוך 10"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#E9ECE6" stroke-width="9"/>
    <circle class="arc" cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${reduceMotion ? off : c}" data-off="${off}" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="num"><div><b style="color:${col}" data-to="${score}">${reduceMotion ? score : 0}</b><small>מתוך 10</small></div></div></div>`;
}

function scale(key, head) {
  if (!head || !head.available) return '';
  const coarse = ['not_fresh', 'defects'].includes(head.label) || (key !== 'ripeness' && head.label === (key === 'freshness' ? 'fresh' : 'none') && last && last._coarse?.[key]);
  const def = SCALES[coarse ? key + '_c' : key]; if (!def) return '';
  const idx = def.stops.findIndex(s => s[0] === head.label);
  const segs = def.stops.map((s, i) => `<div class="seg ${i === idx ? 'on' : ''}" style="background:${s[2]}"></div>`).join('');
  const ticks = def.stops.map((s, i) => `<span class="${i === idx ? 'on' : ''}">${s[1]}</span>`).join('');
  const value = idx >= 0 ? esc(head.label_he) : 'לא ודאי';
  return `<div class="scale"><div class="shd"><span>${def.title}</span><b>${value}</b></div><div class="bar">${segs}</div><div class="ticks">${ticks}</div></div>`;
}

function renderResult(r) {
  if (r.status !== 'ok') return renderState(r);
  // Which quality heads are coarse (good vs defects) for this produce: from the bundle, if loaded.
  const sup = bundle?.supported_heads?.[r.produce] || [];
  r._coarse = { freshness: sup.includes('freshness~coarse') && !sup.includes('freshness'),
                visual_spoilage: sup.includes('visual_spoilage~coarse') && !sup.includes('visual_spoilage') };
  last = r;
  const assessed = r.recommendation && r.recommendation !== 'inspect';
  let h = `<div class="head"><img class="thumb" src="${photoUrl}" alt=""><div><div class="name" id="sheetTitle">${esc(r.emoji)} ${esc(r.produce_he)}</div>
           <div class="conf">${confText(r.produce_confidence)}</div></div>
           <button class="share" id="share" aria-label="שיתוף התוצאה"><svg class="ico"><use href="#i-share"/></svg></button></div>`;
  // 1. Score + verdict (Yuka): the number, a word, and one line of why.
  if (r.score != null) {
    const [word, col] = verdict(r.score);
    h += `<div class="card score">${gauge(r.score)}<div><div class="label-sm">ציון איכות חזותי</div>
          <div class="verdict" style="color:${col}">${word}</div><div class="reason">${esc(r.score_reason_he)}</div></div></div>`;
  } else {
    h += `<div class="card score">${gauge(null)}<div><div class="label-sm">ציון איכות חזותי</div>
          <div class="verdict" style="color:var(--muted);font-size:19px">אין עדיין דירוג לסוג הזה</div>
          <div class="reason small">${esc(r.score_reason_he)}</div></div></div>`;
  }
  // 2. What to do (the useful action).
  if (assessed) {
    const [tone, ic] = ACTION[r.recommendation] || ['t-mid', '•'];
    h += `<div class="action ${tone}"><span class="ic">${ic}</span><span>${esc(r.recommendation_he)}</span></div>`;
  }
  // 3. What we checked: scales.
  const scales = scale('ripeness', r.ripeness) + scale('freshness', r.freshness) + scale('visual_spoilage', r.visual_spoilage);
  if (scales) h += `<div class="card"><h3>מה בדקנו בתמונה</h3>${scales}</div>`;
  // 4. How to keep it.
  if (r.storage_tip_he && !['discard', 'check_defects'].includes(r.recommendation))
    h += `<div class="card tip"><b>💡 איך לשמור (כללי)</b>${esc(r.storage_tip_he)}</div>`;
  // 5. Detail, collapsed.
  if (assessed && r.explanation_he?.length)
    h += `<details><summary>למה?</summary><div class="body"><ul class="why">${r.explanation_he.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div></details>`;
  if (r.top3?.length)
    h += `<details><summary>מה עוד זה יכול להיות?</summary><div class="body">${r.top3.map(t => `<div class="alt"><span style="width:84px">${esc(t.he)}</span><div class="track"><div class="fill" style="width:${Math.round(t.prob * 100)}%"></div></div><span class="pct">${pct5(t.prob)}</span></div>`).join('')}</div></details>`;
  h += `<div class="disc">&#x200F;ⓘ ${esc(r.disclaimer_he)}</div>
        <div class="actions"><button class="primary" id="again">סרוק פרי נוסף</button>
        <div class="fb" id="fb"><span>הזיהוי נכון?</span><button aria-label="כן" data-v="1">👍</button><button aria-label="לא" data-v="0">👎</button></div></div>`;
  openSheet(h, r.produce_he);
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.arc').forEach(a => a.style.strokeDashoffset = a.dataset.off)));
  document.querySelectorAll('.num b[data-to]').forEach(countUp);
  $('share').onclick = () => shareResult(r);
  addHistory(r);
  $('again').onclick = () => { firstAngle = null; reset(); };
  document.querySelectorAll('#fb button').forEach(b => b.onclick = () => sendFeedback(b.dataset.v === '1'));
}

function renderState(r) {
  const [ic, title] = STATE[r.status] || ['•', ''];
  let h = `<div class="state">${photoUrl ? `<div class="pic"><img src="${photoUrl}" alt=""><span class="badge">${ic}</span></div>` : `<div class="big">${ic}</div>`}<h2 id="sheetTitle">${title}</h2><p>${esc(r.message_he)}</p></div><div class="actions">`;
  if (r.status === 'unsure' && (r.angles || 1) < 2) {
    h += `<button class="primary" id="angle">צלמו מזווית נוספת</button><button class="secondary" id="again">נסו שוב מההתחלה</button>`;
  } else {
    h += `<button class="primary" id="again">נסו שוב</button>`;
  }
  openSheet(h + '</div>', title);
  $('again').onclick = () => { firstAngle = null; reset(); };
  if ($('angle')) $('angle').onclick = () => { firstAngle = lastBlob; reset(); };
}
function renderError() {
  openSheet(`<div class="state"><div class="big">📶</div><h2>משהו השתבש</h2><p>לא הצלחנו לבדוק את התמונה. בדקו את החיבור לאינטרנט ונסו שוב.</p></div>

    <div class="actions"><button class="primary" id="close">הבנתי</button></div></div>`, 'איך זה עובד');

/* ---------- delight: count-up, share, history (on this device only) ---------- */
function countUp(el) {
  const to = +el.dataset.to; if (reduceMotion) { el.textContent = to; return; }
  const t0 = performance.now(), d = 850;
  const step = t => { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function toast(msg) {
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}
async function shareResult(r) {
  const sc = r.score != null ? ` – ציון ${r.score}/10 (${verdict(r.score)[0]})` : '';
  const text = `${r.emoji || ''} ${r.produce_he}${sc}. ${r.recommendation_he || ''}\nהערכה חזותית בלבד.`;
  const data = { title: 'סורק פירות', text, url: location.origin };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(`${text}\n${location.origin}`); toast('הועתק – אפשר להדביק ולשתף');
  } catch {}
}
const HKEY = 'hist', HMAX = 20;
const loadHist = () => { try { return JSON.parse(store.get(HKEY) || '[]'); } catch { return []; } };
async function thumbOf(url) {
  try {
    const im = new Image(); im.src = url; await im.decode();
    const c = document.createElement('canvas'), n = 96, s = Math.min(im.naturalWidth, im.naturalHeight);
    c.width = c.height = n; c.getContext('2d').drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, n, n);
    return c.toDataURL('image/jpeg', 0.7);
  } catch { return ''; }
}
async function addHistory(r) {
  const h = loadHist();
  h.unshift({ t: Date.now(), he: r.produce_he, emoji: r.emoji, score: r.score ?? null, rec: r.recommendation_he || '', img: await thumbOf(photoUrl) });
  store.set(HKEY, JSON.stringify(h.slice(0, HMAX))); $('hdot').hidden = false;
}
const ago = t => { const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'עכשיו' : m < 60 ? `לפני ${m} דק׳` : m < 1440 ? `לפני ${Math.round(m / 60)} שע׳` : new Date(t).toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }); };
function showHistory() {
  if (busy) return; $('hdot').hidden = true;
  const h = loadHist();
  const list = h.length ? `<ul class="hist">${h.map(e => `<li><img src="${e.img || '/web/icon-192.png'}" alt="">
      <div class="t"><b>${esc(e.emoji)} ${esc(e.he)}</b><span>${esc(ago(e.t))}${e.rec ? ' · ' + esc(e.rec) : ''}</span></div>
      ${e.score != null ? `<span class="sc" style="background:${verdict(e.score)[1]}">${e.score}</span>` : '<span class="sc none">—</span>'}</li>`).join('')}</ul>
      <p class="small" style="margin-top:10px">נשמר רק במכשיר הזה.</p>`
    : `<div class="empty"><div class="big">🧺</div>עוד לא סרקתם כלום.<br>הסריקות האחרונות יופיעו כאן.</div>`;
  openSheet(`<div class="info"><h2 id="sheetTitle">הסריקות שלי</h2>${list}
    <div class="actions">${h.length ? '<button class="secondary" id="clearH">ניקוי ההיסטוריה</button>' : ''}<button class="primary" id="close">חזרה למצלמה</button></div></div>`, 'הסריקות שלי');
  $('close').onclick = () => closeSheet();
  if ($('clearH')) $('clearH').onclick = () => { store.set(HKEY, '[]'); showHistory(); };
}
function showRated(b) {
  const em = Object.keys(b.supported_heads || {}).map(p => b.produce_meta?.[p]?.emoji).filter(Boolean);
  if (em.length) { $('ratedList').textContent = em.join(''); $('rated').hidden = false; }
}

/* ---------- wiring ---------- */
function fromFile(e) { const f = e.target.files[0]; e.target.value = ''; if (f) analyze(f); }
$('scan').onclick = onScan;
$('galBtn').onclick = () => $('gal').click();
$('gal').onchange = fromFile; $('cam').onchange = fromFile;
$('sampleBtn').onclick = showSamples; $('infoBtn').onclick = showInfo; $('histBtn').onclick = showHistory;
$('scrim').onclick = () => { if (!$('stage').classList.contains('analyzing')) reset(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') reset(); });
fetch('/v1/bundle').then(r => r.json()).then(b => { bundle = b; showRated(b); }).catch(() => {});
// Returning users who allowed the camera go straight to the live viewfinder (principle 1); others see the welcome.
if (store.get('cam') === 'ok') startCamera();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
